name: Build Android APK

# Builds a sideloadable debug APK entirely on GitHub runners (no EAS queue, no Expo Go).
# Trigger manually from the Actions tab, or on push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Write .env from secrets
        run: |
          cat > .env <<'EOF'
          EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_GROQ_KEY_1=${{ secrets.EXPO_PUBLIC_GROQ_KEY_1 }}
          EXPO_PUBLIC_GROQ_KEY_2=${{ secrets.EXPO_PUBLIC_GROQ_KEY_2 }}
          EXPO_PUBLIC_GROQ_KEY_3=${{ secrets.EXPO_PUBLIC_GROQ_KEY_3 }}
          EXPO_PUBLIC_GROQ_KEY_4=${{ secrets.EXPO_PUBLIC_GROQ_KEY_4 }}
          EXPO_PUBLIC_GROQ_KEY_5=${{ secrets.EXPO_PUBLIC_GROQ_KEY_5 }}
          EOF

      - name: Prebuild (generate android/)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (bundled JS, standalone, debug-signed)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gymbuddy-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
